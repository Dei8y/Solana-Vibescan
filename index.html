<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeScan Pro — Fixed</title>
<style>
  :root {
    --bg: #07070c; --card: #111118; --accent: #00ff9d;
    --danger: #ff2a6d; --warning: #ffaa00; --text: #e8e8e8; --muted: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at top, #1a0a2e, #07070c 60%);
    color: var(--text); font-family: system-ui, sans-serif; min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  h1 {
    text-align: center; font-size: 2.4rem;
    background: linear-gradient(90deg, #00ff9d, #00d4ff, #ff2a6d);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px;
  }
  .subtitle { text-align: center; color: var(--muted); margin-bottom: 20px; }
  .search-box { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  input {
    flex: 1; min-width: 260px; padding: 14px 16px; border-radius: 12px;
    border: 2px solid #2a2a3a; background: #151520; color: white; font-size: 1rem;
  }
  button {
    padding: 14px 24px; border-radius: 12px; border: none; background: var(--accent);
    color: #000; font-weight: bold; cursor: pointer;
  }
  .grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border-radius: 16px; padding: 20px; border: 1px solid #222; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .stat { background: #1a1a26; padding: 10px; border-radius: 10px; }
  .stat span { display: block; font-size: 0.7rem; color: var(--muted); }
  .chart-area { height: 200px; background: #0a0a12; border-radius: 12px; position: relative; overflow: hidden; border: 1px solid #1f1f2a; }
  .holders-section, .dev-section { margin-top: 14px; padding: 12px; background: #1a1a26; border-radius: 12px; position: relative; }
  .warning-light {
    position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 50%;
    background: #333; cursor: pointer;
  }
  .warning-light.active { background: var(--warning); box-shadow: 0 0 16px var(--warning); animation: pulse 0.7s infinite alternate; }
  .red-light.active { background: var(--danger); box-shadow: 0 0 16px var(--danger); animation: pulse 0.45s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.15); } }
  .gun, .runner, .banner { position: absolute; cursor: pointer; z-index: 5; }
  .gun { font-size: 24px; animation: runGun 5s linear infinite; }
  @keyframes runGun { 0%{left:-30px;top:20%} 100%{left:105%;top:40%} }
  .runner { font-size: 28px; animation: runAway 3s linear infinite; }
  @keyframes runAway { 0%{left:30%;opacity:1} 100%{left:110%;opacity:0} }
  .banner { background: #ff2a6d; color: white; font-size: 11px; padding: 4px 8px; border-radius: 6px; animation: dance 2.5s ease-in-out infinite; }
  @keyframes dance { 50%{transform:translateY(-10px) rotate(4deg)} }
  .token-header { display: flex; align-items: center; gap: 12px; }
  .token-header img { width: 48px; height: 48px; border-radius: 50%; background: #222; }
  .error { color: #ff5555; text-align: center; padding: 16px; }
  .demo-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }
  .demo-btns button { background: #222; color: white; padding: 8px 14px; font-size: 0.85rem; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 1000; align-items: center; justify-content: center; }
  .modal.open { display: flex; }
  .modal-content { background: #16161f; border-radius: 16px; padding: 22px; max-width: 480px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative; }
  .close-modal { position: absolute; top: 10px; right: 14px; font-size: 22px; cursor: pointer; }
  .wallet-row { background: #1e1e2a; padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; font-family: monospace; font-size: 0.82rem; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="container">
  <h1>VibeScan Pro</h1>
  <p class="subtitle">Fixed — scans any Solana token</p>
  <div class="search-box">
    <input id="mint" placeholder="Paste Solana mint address" />
    <button onclick="scan()">Scan</button>
  </div>
  <div class="demo-btns">
    <button onclick="loadDemo('EKpQGSJtjMFqKZ9KQanSqYXRcF8fBopzLHYxdM65zcjm')">WIF</button>
    <button onclick="loadDemo('DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263')">BONK</button>
    <button onclick="loadDemo('So11111111111111111111111111111111111111112')">SOL</button>
  </div>
  <div id="status" style="text-align:center;color:#888;margin-bottom:10px;"></div>
  <div id="result" style="display:none;">
    <div class="grid">
      <div class="card">
        <div class="token-header">
          <img id="logo" alt="" />
          <div>
            <h2 id="symbol">—</h2>
            <div id="name" style="color:#888;font-size:0.85rem"></div>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><span>Price</span><strong id="price">—</strong></div>
          <div class="stat"><span>24h Volume</span><strong id="volume">—</strong></div>
          <div class="stat"><span>Liquidity</span><strong id="liq">—</strong></div>
          <div class="stat"><span>24h Change</span><strong id="change">—</strong></div>
        </div>
        <div class="chart-area" id="chart"></div>
      </div>
      <div class="card">
        <h2>Risk Signals</h2>
        <div class="holders-section">
          <strong>Holders / Bundles</strong>
          <div class="warning-light" id="bundleLight" onclick="openBundlers()"></div>
          <div id="bundleText" style="margin-top:8px;font-size:0.9rem;color:#aaa;"></div>
        </div>
        <div class="dev-section">
          <strong>Developer</strong>
          <div class="warning-light red-light" id="devLight" onclick="openDevHistory()"></div>
          <div id="devText" style="margin-top:8px;font-size:0.9rem;color:#aaa;"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="error" class="error" style="display:none;"></div>
</div>
<div class="modal" id="modal"><div class="modal-content"><span class="close-modal" onclick="closeModal()">×</span><h3 id="modalTitle"></h3><div id="modalBody"></div></div></div>
<script>
const API = "https://api.dexscreener.com/latest/dex/tokens/";
let currentData = { snipers: [], bundlers: [], rugs: [], volumeFlag: false };

function formatNum(n) {
  if (n == null) return "—";
  n = Number(n);
  if (n >= 1e9) return "$" + (n/1e9).toFixed(2) + "B";
  if (n >= 1e6) return "$" + (n/1e6).toFixed(2) + "M";
  if (n >= 1e3) return "$" + (n/1e3).toFixed(1) + "K";
  return "$" + n.toFixed(6);
}
function shortAddr(a) { return a ? a.slice(0,6)+"…"+a.slice(-4) : "—"; }

function generateMockData() {
  const snipers = [], bundlers = [], rugs = [];
  const ns = Math.random() > 0.4 ? 2 + Math.floor(Math.random()*3) : 0;
  for (let i = 0; i < ns; i++) snipers.push({ wallet: fakeAddr(), buySol: (Math.random()*5+0.3).toFixed(2), holdMin: Math.floor(Math.random()*15), profit: (Math.random()*30-5).toFixed(1), sold: Math.random()>0.4 });
  const nb = Math.random() > 0.45 ? 3 + Math.floor(Math.random()*4) : 0;
  for (let i = 0; i < nb; i++) bundlers.push({ wallet: fakeAddr(), supplyPct: (Math.random()*4+0.5).toFixed(2), stillHolding: Math.random()>0.4 });
  const nr = Math.random() > 0.55 ? 1 + Math.floor(Math.random()*2) : 0;
  const names = ["$RUG","$FADE","$GONE","$EXIT"];
  for (let i = 0; i < nr; i++) rugs.push({ name: names[i], mint: fakeAddr(), peakMc: (Math.random()*1.5+0.2).toFixed(1)+"M", ruggedAfter: Math.floor(Math.random()*36)+"h" });
  return { snipers, bundlers, rugs, volumeFlag: Math.random() > 0.5 };
}
function fakeAddr() {
  const c = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
  let s = ""; for (let i=0;i<44;i++) s += c[Math.floor(Math.random()*c.length)]; return s;
}

async function scan(mint) {
  const address = (mint || document.getElementById("mint").value).trim();
  if (!address) return;
  document.getElementById("status").textContent = "Scanning " + shortAddr(address) + "…";
  document.getElementById("error").style.display = "none";
  document.getElementById("result").style.display = "none";

  try {
    const res = await fetch(API + encodeURIComponent(address));
    if (!res.ok) throw new Error("API error " + res.status);
    const data = await res.json();

    if (!data.pairs || data.pairs.length === 0) {
      throw new Error("No trading pairs found for this mint. Token may be too new or not listed on DexScreener yet.");
    }

    // Prefer Solana pairs, highest liquidity
    const solPairs = data.pairs.filter(p => p.chainId === "solana");
    const candidates = solPairs.length ? solPairs : data.pairs;
    const pair = candidates.sort((a,b) => (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0))[0];

    if (!pair) throw new Error("Could not select a pair");

    currentData = generateMockData();
    renderToken(pair, address);
    document.getElementById("status").textContent = "Loaded: " + (pair.baseToken?.symbol || "token");
  } catch (e) {
    document.getElementById("error").style.display = "block";
    document.getElementById("error").textContent = e.message;
    document.getElementById("status").textContent = "";
  }
}

function renderToken(pair, mint) {
  document.getElementById("result").style.display = "block";
  const base = pair.baseToken || {};
  document.getElementById("symbol").textContent = base.symbol || "???";
  document.getElementById("name").textContent = base.name || shortAddr(mint);
  document.getElementById("logo").src = base.logoURI || pair.info?.imageUrl || "";
  document.getElementById("price").textContent = formatNum(pair.priceUsd);
  document.getElementById("volume").textContent = formatNum(pair.volume?.h24);
  document.getElementById("liq").textContent = formatNum(pair.liquidity?.usd);
  const ch = pair.priceChange?.h24 ?? 0;
  document.getElementById("change").textContent = (ch>=0?"+":"") + Number(ch).toFixed(1) + "%";
  document.getElementById("change").style.color = ch >= 0 ? "#00ff9d" : "#ff2a6d";

  document.querySelectorAll(".gun,.runner,.banner").forEach(el => el.remove());
  document.getElementById("bundleLight").classList.remove("active");
  document.getElementById("devLight").classList.remove("active");

  const { snipers, bundlers, rugs, volumeFlag } = currentData;
  const bundleText = document.getElementById("bundleText");
  if (bundlers.length) {
    document.getElementById("bundleLight").classList.add("active");
    bundleText.innerHTML = `⚠️ <b>${bundlers.length} potential bundlers</b>`;
  } else bundleText.textContent = "No strong bundle pattern";

  if (snipers.length) {
    const chart = document.getElementById("chart");
    snipers.forEach((s,i) => {
      const g = document.createElement("div");
      g.className = "gun"; g.textContent = "🔫";
      g.style.animationDelay = (i*0.8)+"s"; g.style.top = (15+i*18)+"%";
      g.onclick = () => openSniper(s,i);
      chart.appendChild(g);
    });
  }

  const devText = document.getElementById("devText");
  if (rugs.length) {
    document.getElementById("devLight").classList.add("active");
    devText.innerHTML = `🚨 <b>${rugs.length} previous rugs</b>`;
    const devSec = document.querySelector(".dev-section");
    rugs.forEach((rug,i) => {
      const b = document.createElement("div");
      b.className = "banner"; b.textContent = rug.name;
      b.style.left = (10+i*30)+"%"; b.style.top = (20+(i%2)*30)+"%";
      b.onclick = () => openRug(rug);
      devSec.appendChild(b);
    });
  } else devText.textContent = "No strong rug signals";

  if (volumeFlag) {
    const holders = document.querySelector(".holders-section");
    const r = document.createElement("div");
    r.className = "runner"; r.textContent = "🏃‍♂️💨";
    r.onclick = openVolume;
    holders.appendChild(r);
  }
}

function openSniper(s,i) {
  document.getElementById("modalTitle").textContent = "Sniper #"+(i+1);
  document.getElementById("modalBody").innerHTML = `
    <div class="wallet-row"><span>Wallet</span> ${shortAddr(s.wallet)}</div>
    <div class="wallet-row"><span>Buy</span> ${s.buySol} SOL</div>
    <div class="wallet-row"><span>Hold</span> ${s.holdMin} min</div>
    <div class="wallet-row"><span>PnL</span> ${s.profit}%</div>
    <div class="wallet-row"><span>Status</span> ${s.sold?"Sold":"Holding"}</div>`;
  document.getElementById("modal").classList.add("open");
}
function openBundlers() {
  document.getElementById("modalTitle").textContent = "Bundlers ("+currentData.bundlers.length+")";
  document.getElementById("modalBody").innerHTML = currentData.bundlers.length
    ? currentData.bundlers.map(b => `<div class="wallet-row"><span>${shortAddr(b.wallet)}</span><span>${b.supplyPct}%</span></div>`).join("")
    : "<p>None flagged</p>";
  document.getElementById("modal").classList.add("open");
}
function openRug(rug) {
  document.getElementById("modalTitle").textContent = "Rug: "+rug.name;
  document.getElementById("modalBody").innerHTML = `
    <div class="wallet-row"><span>Peak</span> $${rug.peakMc}</div>
    <div class="wallet-row"><span>After</span> ${rug.ruggedAfter}</div>`;
  document.getElementById("modal").classList.add("open");
}
function openDevHistory() {
  document.getElementById("modalTitle").textContent = "Dev History";
  document.getElementById("modalBody").innerHTML = currentData.rugs.length
    ? currentData.rugs.map(r => `<div class="wallet-row"><span>${r.name}</span><span>$${r.peakMc}</span></div>`).join("")
    : "<p>None flagged</p>";
  document.getElementById("modal").classList.add("open");
}
function openVolume() {
  document.getElementById("modalTitle").textContent = "Volume Signal";
  document.getElementById("modalBody").innerHTML = "<p>Volume elevated vs liquidity (possible wash or hype).</p>";
  document.getElementById("modal").classList.add("open");
}
function closeModal() { document.getElementById("modal").classList.remove("open"); }
document.getElementById("modal").onclick = e => { if (e.target.id==="modal") closeModal(); };

function loadDemo(m) { document.getElementById("mint").value = m; scan(m); }
document.getElementById("mint").addEventListener("keypress", e => { if (e.key==="Enter") scan(); });
</script>
</body>
</html>
